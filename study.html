<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scripture Memory — Study</title>
<link rel="stylesheet" href="styles.css">
<style>

  html, body {
    height: 100%;
    overflow: hidden;
  }

  .stage {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(var(--sp-xs), env(safe-area-inset-top)) var(--sp-xs) 0;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--body);
    text-decoration: none;
    padding: 8px 4px;
  }
  .back:hover, .back:focus-visible { color: var(--ink); }
  .back svg { width: 16px; height: 16px; }

  #settingsBtn svg { width: 26px; height: 26px; }

  /* ---------- passage ---------- */
  .passage-zone {
    position: relative;
    display: grid;
    place-items: center;
    padding: 8px 56px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
  }

  .passage-inner {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .anchor-tag {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: clamp(10px, 2.5vh, var(--sp-sm));
  }

  .passage {
    font-family: var(--font);
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: -0.2px;
    text-align: center;
    color: var(--ink);
    white-space: normal;
    transition: font-size 0.2s ease;
  }

  .word {
    display: inline-block;
    white-space: pre;
    transition: color 0.2s ease;
  }

  .word .blank {
    color: var(--muted);
  }

  .word.revealed {
    animation: ink-in 0.32s ease both;
  }
  @keyframes ink-in {
    from { opacity: 0; filter: blur(2px); transform: translateY(2px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }

  .punct { color: var(--body); }

  .reference-line {
    margin-top: clamp(16px, 4vh, var(--sp-md));
    font-family: var(--font);
    font-weight: 500;
    font-size: clamp(17px, 2.6vw, 26px);
    letter-spacing: -0.1px;
    color: var(--ink);
    text-align: center;
  }
  .hint {
    display: block;
    margin-top: var(--sp-xs);
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.1px;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .hint.hidden { opacity: 0; }

  /* ---------- prev / next arrows ---------- */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--body);
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    cursor: pointer;
    border-radius: 0;
    z-index: 2;
  }
  .nav-arrow:hover, .nav-arrow:focus-visible {
    color: var(--ink);
    background: var(--canvas-elevated);
  }
  .nav-arrow:disabled {
    opacity: 0.25;
    cursor: default;
  }
  .nav-arrow:disabled:hover { background: none; }
  .nav-arrow svg { width: 24px; height: 24px; }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }

  /* ---------- bottom bar ---------- */
  .bottombar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-xs);
    padding: 0 var(--sp-xs) max(var(--sp-xs), env(safe-area-inset-bottom));
    font-size: 11px;
    color: var(--muted);
  }

  .progress-line {
    display: flex;
    align-items: center;
    gap: var(--sp-xxs);
  }
  .progress-track {
    width: 64px;
    height: 2px;
    background: var(--hairline);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width 0.3s ease;
  }
  .progress-label { font-variant-numeric: tabular-nums; }

  /* ---------- settings sheet ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: min(380px, 100%);
    background: var(--canvas-elevated);
    border-top: 1px solid var(--hairline-soft, #3a3a3a);
    border-radius: 0;
    padding: var(--sp-sm) var(--sp-sm) max(var(--sp-sm), env(safe-area-inset-bottom));
    transition: transform 0.28s ease;
    z-index: 11;
  }
  .sheet.open { transform: translate(-50%, 0); }

  .sheet h2 {
    font-family: var(--font);
    font-weight: 500;
    font-size: 18px;
    margin: 0 0 4px;
  }
  .sheet p.desc {
    font-size: 12px;
    color: var(--body);
    margin: 0 0 var(--sp-xs);
    line-height: 1.5;
  }

  .segmented {
    display: flex;
    gap: 8px;
    margin-bottom: var(--sp-xs);
  }
  .segmented button {
    flex: 1;
    padding: 10px 0;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    color: var(--body);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border-radius: 0;
    cursor: pointer;
  }
  .segmented button.active {
    border-color: var(--primary);
    color: var(--ink);
    background: var(--primary-soft);
  }

  .sheet-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--hairline);
    padding-top: var(--sp-xs);
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--body);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 4px 0;
  }
  .reset-link:hover { color: var(--primary); }

  @media (max-width: 560px) {
    .passage-zone { padding: 8px 52px; }
    .nav-arrow { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 12 12" fill="none"><path d="M7.5 2.5L3 6l4.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Library
    </a>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 12.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z" stroke="currentColor" stroke-width="1.3"/><path d="M16.2 12.4a1.2 1.2 0 00.25 1.32l.04.04a1.45 1.45 0 11-2.05 2.05l-.04-.04a1.2 1.2 0 00-1.32-.25 1.2 1.2 0 00-.73 1.1v.12a1.45 1.45 0 11-2.9 0v-.06a1.2 1.2 0 00-.78-1.1 1.2 1.2 0 00-1.32.25l-.04.04a1.45 1.45 0 11-2.05-2.05l.04-.04a1.2 1.2 0 00.25-1.32 1.2 1.2 0 00-1.1-.73h-.12a1.45 1.45 0 110-2.9h.06a1.2 1.2 0 001.1-.78 1.2 1.2 0 00-.25-1.32l-.04-.04A1.45 1.45 0 115.2 3.5l.04.04a1.2 1.2 0 001.32.25h.06a1.2 1.2 0 00.73-1.1v-.12a1.45 1.45 0 112.9 0v.06a1.2 1.2 0 00.73 1.1 1.2 1.2 0 001.32-.25l.04-.04a1.45 1.45 0 112.05 2.05l-.04.04a1.2 1.2 0 00-.25 1.32v.06a1.2 1.2 0 001.1.73h.12a1.45 1.45 0 110 2.9h-.06a1.2 1.2 0 00-1.1.73z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="passage-zone" id="passageZone" role="button" tabindex="0" aria-label="Tap to reveal a word">
    <button class="nav-arrow nav-prev icon-btn" id="prevBtn" aria-label="Previous passage">
      <svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5L6 10l6.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="passage-inner">
      <div class="anchor-tag" id="anchorTag"></div>
      <p class="passage" id="passage"></p>
      <div class="reference-line" id="referenceLine"></div>
      <span class="hint" id="hint">Tap anywhere to reveal a word</span>
    </div>

    <button class="nav-arrow nav-next icon-btn" id="nextBtn" aria-label="Next passage">
      <svg viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L14 10l-6.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="bottombar">
    <div class="progress-line">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">0/0</span>
    </div>
  </div>

</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Settings">
  <h2>Reveal settings</h2>
  <p class="desc">Choose how many words uncover with each tap.</p>
  <div class="segmented" id="segmented">
    <button data-n="1">1</button>
    <button data-n="2">2</button>
    <button data-n="3">3</button>
    <button data-n="5">5</button>
  </div>
  <div class="sheet-actions">
    <button class="reset-link" id="resetBtn">Reset all blanks</button>
    <button class="button-primary" id="doneBtn">Done</button>
  </div>
</div>

<script src="verses.js"></script>
<script>
  // ---------- resolve which verse to show ----------
  const params = new URLSearchParams(location.search);
  const requestedSlug = params.get('v');
  let index = Math.max(0, VERSES.findIndex(v => v.slug === requestedSlug));
  if (requestedSlug && index === -1) index = 0;

  let VERSE, revealPerTap = 2, state = [];

  const passageEl = document.getElementById('passage');
  const passageZone = document.getElementById('passageZone');
  const anchorTag = document.getElementById('anchorTag');
  const referenceLine = document.getElementById('referenceLine');
  const hintEl = document.getElementById('hint');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // token = optional lead punctuation + letters/hyphens/apostrophes (core) + optional trail punctuation
  function splitWord(w) {
    const m = w.match(/^([^A-Za-z]*)([A-Za-z'-]+)([^A-Za-z]*)$/);
    return m ? { lead: m[1], core: m[2], trail: m[3] } : { lead: '', core: w, trail: '' };
  }

  function loadVerse(i) {
    index = i;
    VERSE = VERSES[index];
    state = VERSE.words.map(() => false);
    anchorTag.textContent = VERSE.anchor;
    referenceLine.textContent = VERSE.ref;
    hintEl.classList.remove('hidden');
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === VERSES.length - 1;
    render();
    fitText();
  }

  let wordEls = [];

  function render() {
    passageEl.innerHTML = VERSE.words.map((w, i) => {
      const { lead, core, trail } = splitWord(w);
      const revealed = state[i];
      const body = revealed
        ? core
        : `<span class="blank">${'_'.repeat(core.length)}</span>`;
      return `<span class="word${revealed ? ' revealed' : ''}" data-i="${i}">${lead}${body}${trail}</span> `;
    }).join('');
    wordEls = [...passageEl.querySelectorAll('.word')];

    updateProgress();
  }

  function updateProgress() {
    const doneCount = state.filter(Boolean).length;
    const pct = Math.round((doneCount / state.length) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${doneCount}/${state.length}`;
  }

  function revealRandom(n) {
    const remaining = state.map((v, i) => v ? null : i).filter(v => v !== null);
    if (remaining.length === 0) return;
    const picks = [];
    for (let k = 0; k < n && remaining.length; k++) {
      const pick = remaining.splice(Math.floor(Math.random() * remaining.length), 1)[0];
      state[pick] = true;
      picks.push(pick);
    }
    hintEl.classList.add('hidden');

    // Update only the newly revealed words in place so already-revealed
    // words don't get torn down and replayed through the reveal animation.
    picks.forEach((i, order) => {
      const { lead, core, trail } = splitWord(VERSE.words[i]);
      const el = wordEls[i];
      el.innerHTML = `${lead}${core}${trail}`;
      el.style.animationDelay = `${order * 45}ms`;
      el.classList.add('revealed');
    });

    updateProgress();
    shrinkToFit();
  }

  // ---------- dynamic font size: start big, shrink to fit the viewport ----------
  function fits() {
    const zone = passageZone;
    return passageEl.scrollWidth <= zone.clientWidth - 4 &&
      document.querySelector('.passage-inner').scrollHeight <= zone.clientHeight - 4;
  }

  // Full reset: used on verse load / viewport resize, where a size jump is expected.
  function fitText() {
    const maxByViewport = Math.min(window.innerWidth * 0.085, 88);
    let size = Math.max(maxByViewport, 22);
    passageEl.style.fontSize = size + 'px';

    let guard = 0;
    while (!fits() && size > 14 && guard < 60) {
      size -= 2;
      passageEl.style.fontSize = size + 'px';
      guard++;
    }
  }

  // Shrink-only check: used after revealing words, so the text never snaps
  // back up to its max size mid-tap — it only nudges down if it no longer fits.
  function shrinkToFit() {
    let size = parseFloat(passageEl.style.fontSize) || 22;
    let guard = 0;
    while (!fits() && size > 14 && guard < 60) {
      size -= 2;
      passageEl.style.fontSize = size + 'px';
      guard++;
    }
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitText, 120);
  });

  // ---------- interactions ----------
  passageZone.addEventListener('click', (e) => {
    if (e.target.closest('.nav-arrow')) return;
    revealRandom(revealPerTap);
  });
  passageZone.addEventListener('keydown', (e) => {
    if (e.target.closest('.nav-arrow')) return;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      revealRandom(revealPerTap);
    }
  });

  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (index > 0) {
      const slug = VERSES[index - 1].slug;
      history.replaceState(null, '', `study.html?v=${slug}`);
      loadVerse(index - 1);
    }
  });
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (index < VERSES.length - 1) {
      const slug = VERSES[index + 1].slug;
      history.replaceState(null, '', `study.html?v=${slug}`);
      loadVerse(index + 1);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (sheet.classList.contains('open')) return;
    if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
    if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  });

  // Settings sheet
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  const settingsBtn = document.getElementById('settingsBtn');
  const doneBtn = document.getElementById('doneBtn');
  const resetBtn = document.getElementById('resetBtn');
  const segmented = document.getElementById('segmented');

  function openSheet() {
    sheet.classList.add('open');
    backdrop.classList.add('open');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
  }

  settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); openSheet(); });
  backdrop.addEventListener('click', closeSheet);
  doneBtn.addEventListener('click', closeSheet);

  segmented.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-n]');
    if (!btn) return;
    revealPerTap = Number(btn.dataset.n);
    [...segmented.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  resetBtn.addEventListener('click', () => {
    state.forEach((_, i) => state[i] = false);
    hintEl.classList.remove('hidden');
    render();
    fitText();
    closeSheet();
  });

  // init
  [...segmented.children][1].classList.add('active');
  loadVerse(index);
</script>
</body>
</html>
