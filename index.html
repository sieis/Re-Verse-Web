<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripture Memory — Progress &amp; Perfection</title>
<link rel="stylesheet" href="styles.css">
<style>

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: var(--sp-xl) var(--sp-xs) var(--sp-xxl);
  }

  header.page-head {
    margin-bottom: var(--sp-xxl);
  }

  .eyebrow {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--primary);
  }

  h1 {
    font-family: var(--font);
    font-weight: 500;
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.9px;
    margin: var(--sp-xxs) 0 var(--sp-xs);
  }

  .page-head p {
    color: var(--body);
    font-size: 14px;
    line-height: 1.5;
    max-width: 46ch;
    margin: 0;
  }

  section.theme {
    margin-bottom: var(--sp-md);
  }

  .theme-head {
    display: flex;
    align-items: baseline;
    gap: var(--sp-xs);
    padding: var(--sp-xxs) 0;
    margin-bottom: var(--sp-xxxs);
    border-bottom: 1px solid var(--hairline);
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    color: inherit;
    font: inherit;
  }

  .theme-head:hover .theme-name,
  .theme-head:focus-visible .theme-name {
    color: var(--primary);
  }

  .theme-num {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }

  .theme-name {
    font-family: var(--font);
    font-weight: 500;
    font-size: clamp(20px, 3vw, 26px);
    letter-spacing: -0.2px;
    transition: color 0.15s ease;
  }

  .theme-range {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .theme-chevron {
    margin-left: auto;
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    color: var(--muted);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  section.theme.open .theme-chevron {
    transform: rotate(90deg);
  }

  ol.verses {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }

  section.theme.open ol.verses {
    max-height: 2000px;
  }

  .verse-row {
    display: grid;
    grid-template-columns: 72px 1fr auto;
    align-items: center;
    gap: var(--sp-xs);
    padding: var(--sp-xs) var(--sp-xxxs);
    border-bottom: 1px solid var(--hairline);
    text-decoration: none;
    color: inherit;
    transition: background 0.15s ease;
  }

  a.verse-row:hover,
  a.verse-row:focus-visible {
    background: var(--canvas-elevated);
  }

  .verse-row .date {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .verse-row .meta .anchor {
    font-family: var(--font);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.1px;
    color: var(--ink);
  }

  .verse-row .meta .ref {
    display: block;
    font-size: 12.5px;
    color: var(--body);
    margin-top: 2px;
  }

  footer.social {
    margin-top: var(--sp-xl);
    padding-top: var(--sp-sm);
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-sm);
  }

  footer.social a {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    color: var(--body);
    transition: color 0.15s ease;
  }
  footer.social a:hover,
  footer.social a:focus-visible {
    color: var(--primary);
  }
  footer.social svg {
    width: 18px;
    height: 18px;
  }

  .subscribe {
    margin: var(--sp-sm) auto 0;
    max-width: 420px;
    text-align: center;
  }

  .subscribe-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--body);
    margin: 0 0 var(--sp-xs);
  }
</style>
</head>
<body>

<script src="verses.js"></script>
<script>
  const sectionsEl = document.getElementById('sections');

  const sections = [];
  const bySection = {};
  VERSES.forEach(v => {
    if (!bySection[v.section]) {
      bySection[v.section] = { name: v.section, verses: [] };
      sections.push(bySection[v.section]);
    }
    bySection[v.section].verses.push(v);
  });

  sections.forEach((section, si) => {
    const sec = document.createElement('section');
    sec.className = 'theme';

    const first = section.verses[0].date;
    const last = section.verses[section.verses.length - 1].date;
    const range = first.slice(0, 3) + ' – ' + last.slice(0, 3);

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'theme-head';
    head.setAttribute('aria-expanded', 'false');
    head.innerHTML = `
      <span class="theme-num">${String(si + 1).padStart(2, '0')}</span>
      <span class="theme-name">${section.name}</span>
      <span class="theme-range">${range}</span>
      <span class="theme-chevron">
        <svg viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L14 10l-6.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    `;
    head.addEventListener('click', () => {
      const isOpen = sec.classList.toggle('open');
      head.setAttribute('aria-expanded', String(isOpen));
    });
    sec.appendChild(head);

    const ol = document.createElement('ol');
    ol.className = 'verses';

    section.verses.forEach(v => {
      const li = document.createElement('li');
      const row = document.createElement('a');
      row.className = 'verse-row';
      row.href = `study.html?v=${v.slug}`;

      row.innerHTML = `
        <span class="date">${v.date}</span>
        <span class="meta">
          <span class="anchor">${v.anchor}</span>
          <span class="ref">${v.ref}</span>
        </span>
        <span class="badge-pill">Study</span>
      `;

      li.appendChild(row);
      ol.appendChild(li);
    });

    sec.appendChild(ol);
    sectionsEl.appendChild(sec);
  });
</script>
</body>
</html>
